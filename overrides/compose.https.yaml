services:
  frontend:
    labels:
      - traefik.enable=true
      - traefik.http.services.frontend.loadbalancer.server.port=8080
      - traefik.http.routers.frontend-https.entrypoints=websecure
      - traefik.http.routers.frontend-https.tls=true
      - traefik.http.routers.frontend-https.tls.certresolver=main-resolver
      - traefik.http.routers.frontend-https.rule=Host(`lemomentum.tech`) || Host(`www.lemomentum.tech`) || Host(`erp.lemomentum.tech`)
      - traefik.http.routers.frontend-https.tls.domains[0].main=lemomentum.tech
      - traefik.http.routers.frontend-https.tls.domains[0].sans=*.lemomentum.tech
  
  proxy:
    image: traefik:v2.11
    restart: unless-stopped
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesResolvers.main-resolver.acme.dnschallenge=true
      - --certificatesResolvers.main-resolver.acme.dnschallenge.provider=cloudflare
      - --certificatesResolvers.main-resolver.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesResolvers.main-resolver.acme.storage=/letsencrypt/acme.json
      - --log.level=DEBUG
    ports:
      - 80:80
      - 443:443
    volumes:
      - cert-data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/traefik-dynamic:/etc/traefik/dynamic:ro

volumes:
  cert-data:
